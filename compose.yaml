services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pki:/etc/nginx/pki:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [app]
    restart: unless-stopped
  app:
    build: ./app
    environment:
      - NASA_ISSUER=NASA Operational CA
      - REQUIRED_POLICY_OIDS=${REQUIRED_POLICY_OIDS:-}
    expose: ["8000"]
    restart: unless-stopped
