services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pki:/etc/nginx/pki:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [app, demo]
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      REQUIRED_POLICY_OIDS: ${REQUIRED_POLICY_OIDS:-}
      REDIS_URL: redis://redis:6379/0\n      PIV_CALLBACK_ALLOWED_ORIGINS: ${PIV_CALLBACK_ALLOWED_ORIGINS:-https://localhost:8443}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://localhost:8443}
      PIV_MTLS_ORIGIN: ${PIV_MTLS_ORIGIN:-https://localhost:8444}
      PIV_DEFAULT_RETURN_URL: ${PIV_DEFAULT_RETURN_URL:-https://localhost:8443/app/}
      PIV_SUBJECT_MAP_JSON: ${PIV_SUBJECT_MAP_JSON:-{}}
      OIDC_CLIENTS_JSON: ${OIDC_CLIENTS_JSON:-{}}
      OIDC_SIGNING_KEY_PATH: /app/oidc/private.pem
      PIV_VALIDATION_API_KEY: ${PIV_VALIDATION_API_KEY:-}
      PIV_STRICT: ${PIV_STRICT:-true}
      PIV_CRL_PATH: ${PIV_CRL_PATH:-/app/pki/issuer.crl}
      PIV_ISSUER_PATH: ${PIV_ISSUER_PATH:-/app/pki/issuer.pem}
      PIV_CRL_DIRECTORY: ${PIV_CRL_DIRECTORY:-/app/pki/crls}
    volumes:
      - ./pki:/app/pki:ro
      - ./oidc:/app/oidc:ro
    depends_on: [redis]
    expose: ["8000"]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    expose: ["6379"]
    restart: unless-stopped
  demo:
    build: ./demo
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-https://localhost:8443}
      OIDC_BACKCHANNEL: http://app:8000
      OIDC_DEMO_CLIENT_ID: piv-demo
      OIDC_DEMO_CALLBACK: https://localhost:8445/callback
    expose: ["8001"]
    restart: unless-stopped
