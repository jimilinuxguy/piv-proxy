services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pki:/etc/nginx/pki:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [app, demo]
    restart: unless-stopped
  app:
    build: ./app
    environment:
      NASA_ISSUER: ${NASA_ISSUER:-NASA Operational CA}
      REQUIRED_POLICY_OIDS: ${REQUIRED_POLICY_OIDS:-2.16.840.1.101.3.2.1.3.13}
      REDIS_URL: redis://redis:6379/0
      PIV_STRICT: ${PIV_STRICT:-true}
      PIV_CRL_PATH: ${PIV_CRL_PATH:-/app/pki/nasa-leaf.crl}
      PIV_ISSUER_PATH: ${PIV_ISSUER_PATH:-/app/pki/nasa-operational.pem}
    volumes:
      - ./pki:/app/pki:ro
    depends_on: [redis]
    expose: ["8000"]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    expose: ["6379"]
    restart: unless-stopped
  demo:
    build: ./demo
    expose: ["8001"]
    restart: unless-stopped
