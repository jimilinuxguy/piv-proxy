# Local-only proof of concept. Do not expose as production authorization.
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><body><h2>PIV Proxy</h2><p><a href="https://localhost:8444/login">Sign in with PIV card</a></p><p><a href="/app/">Protected demo application</a></p><form method="POST" action="/logout"><button type="submit">Sign out</button></form><p>LOCAL TEST ONLY: Strict PIV certificate policy and leaf CRL checks are enabled by default. This is not production authorization.</p></body></html>';
    }
    location = /signed-out {
        default_type text/html;
        return 200 '<!doctype html><html><body><h2>Signed out</h2><p>Your application session has been revoked.</p><p>Your browser may still remember the PIV client certificate; that is separate from the application session.</p><p><a href="/">Return to PIV Proxy</a></p></body></html>';
    }
    location = /_session {
        internal;
        proxy_pass http://app:8000/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-PIV-Cert "";
        proxy_set_header X-PIV-Verified "";
    }
    location /app/ {
        auth_request /_session;
        auth_request_set $piv_identity $upstream_http_x_authenticated_user;
        error_page 401 = @login_required;
        proxy_pass http://demo:8001/;
        proxy_set_header X-Authenticated-User $piv_identity;
        proxy_set_header X-PIV-Cert "";
        proxy_set_header X-PIV-Verified "";
        proxy_set_header Cookie "";
    }
    location @login_required {
        return 302 https://localhost:8443/;
    }
    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://app:8000/logout;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-PIV-Cert "";
        proxy_set_header X-PIV-Verified "";
    }
}
server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/pki/client-ca.pem;
    ssl_trusted_certificate /etc/nginx/pki/client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 5;
    add_header Cache-Control "no-store" always;
    location = /login {
        proxy_pass http://app:8000/login;
        proxy_set_header X-PIV-Verified $ssl_client_verify;
        proxy_set_header X-PIV-Cert $ssl_client_escaped_cert;
        proxy_set_header Cookie "";
    }
    location / { return 404; }
}
