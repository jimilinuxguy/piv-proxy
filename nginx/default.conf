server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    location / {
        default_type text/html;
        return 200 '<!doctype html><html><body><h2>NASA PIV local test</h2><p><a href="https://localhost:8444/">Authenticate with PIV card</a></p></body></html>';
    }
}
server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/pki/client-ca.pem;
    ssl_trusted_certificate /etc/nginx/pki/client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 5;
    add_header Cache-Control "no-store" always;
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-PIV-Verified $ssl_client_verify;
        proxy_set_header X-PIV-Cert $ssl_client_escaped_cert;
        proxy_set_header X-PIV-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-PIV-Subject $ssl_client_s_dn;
        proxy_set_header X-PIV-Issuer $ssl_client_i_dn;
        proxy_set_header X-PIV-Protocol $ssl_protocol;
        proxy_set_header X-PIV-Cipher $ssl_cipher;
    }
}
