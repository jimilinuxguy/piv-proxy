name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==44.0.3 redis==5.2.1
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app/server.py demo/server.py
